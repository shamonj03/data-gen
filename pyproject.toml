[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "datagen"
version = "0.1.0"
requires-python = ">=3.10"
dependencies = [
    "faker>=30",
    "jinja2>=3.1,<4",
    "openpyxl>=3.1,<4",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
datagen = "datagen.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
